<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="About Aba Ibrahim">
  <defs>
    <style>
      .card { fill: #0d1117; }
      .p {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        fill: #c9d1d9;
      }
      .b { font-weight: 700; fill: #e6edf3; }
      .a { font-weight: 600; fill: #79c0ff; }
      .l1 { opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards; }
      .l2 { opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards; }
      .l3 { opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards; }
      .l4 { opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards; }
      .bar {
        fill: #30363d;
        opacity: 0;
        animation: fadeIn 0.8s ease-out 0.1s forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <rect class="card" width="560" height="250" rx="10" />
  <rect class="bar" x="4" y="18" width="3" height="214" rx="1.5" />

  <g class="l1">
    <text class="p" x="20" y="36">
      <tspan class="b">Baim</tspan>, here — a <tspan class="a">Software Engineer</tspan> &amp; <tspan class="a">Motion &amp; Graphics Designer</tspan>
    </text>
    <text class="p" x="20" y="57">
      based in <tspan class="b">Purwokerto, Jawa Tengah</tspan>.
    </text>
  </g>

  <g class="l2">
    <text class="p" x="20" y="92">
      I enjoy building practical web applications and software systems
    </text>
    <text class="p" x="20" y="113">
      while combining clean code with thoughtful visual design.
    </text>
  </g>

  <g class="l3">
    <text class="p" x="20" y="148">
      My stack spans <tspan class="b">Python, C/C++, PHP, MySQL, JS, React</tspan>,
    </text>
    <text class="p" x="20" y="169">
      alongside creative tools like <tspan class="b">Figma</tspan> for UI &amp; visual craftsmanship.
    </text>
  </g>

  <g class="l4">
    <text class="p" x="20" y="204">
      My goal is simple: write clean code, craft meaningful visuals,
    </text>
    <text class="p" x="20" y="225">
      and build software that lasts.
    </text>
  </g>
</svg>
