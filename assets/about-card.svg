<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="600" height="130" role="img" aria-label="About Aba Ibrahim">
  <defs>
    <style>
      .line {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #8b949e;
      }
      .em {
        font-weight: 500;
        fill: #e6edf3;
      }
      .l1 { opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards; }
      .l2 { opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards; }
      .l3 { opacity: 0; animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards; }
      @media (prefers-color-scheme: light) {
        .line { fill: #656d76; }
        .em { fill: #1f2328; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <text class="line l1" x="300" y="34" text-anchor="middle">
    Based in <tspan class="em">Purwokerto, Indonesia</tspan> — crafting software and visual work.
  </text>
  <text class="line l2" x="300" y="66" text-anchor="middle">
    Focused on clean architecture, web applications, and motion design.
  </text>
  <text class="line l3" x="300" y="98" text-anchor="middle">
    Working with <tspan class="em">Python, C/C++, PHP, MySQL, JS, React</tspan>, and <tspan class="em">Figma</tspan>.
  </text>
</svg>
