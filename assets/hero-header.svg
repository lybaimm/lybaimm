<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230" role="img" aria-label="Aba Ibrahim - Software Engineer and Motion &amp; Graphics Designer">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <style>
      .bg { fill: #0d1117; }
      .glow { fill: url(#ambientGlow); animation: pulseGlow 6s ease-in-out infinite; }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 36px;
        font-weight: 700;
        fill: #e6edf3;
        opacity: 0;
        animation: fadeSlideUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
      }
      .role {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 600;
        fill: #79c0ff;
        letter-spacing: 0.4px;
        opacity: 0;
        animation: fadeSlideUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.32s forwards;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 14px;
        fill: #8b949e;
        letter-spacing: 1.4px;
        opacity: 0;
        animation: fadeSlideUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.52s forwards;
      }
      .divider {
        transform-origin: 420px 146px;
        transform: scaleX(0);
        opacity: 0;
        animation: expandLine 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        fill: #c9d1d9;
        opacity: 0;
        animation: fadeSlideUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.78s forwards;
      }
      .pill {
        opacity: 0;
        animation: fadeSlideUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.96s forwards;
      }
      .dot {
        fill: #3fb950;
        animation: blinkDot 2.4s ease-in-out infinite;
      }
      .pillText {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11.5px;
        fill: #8b949e;
      }
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes expandLine {
        from { opacity: 0; transform: scaleX(0); }
        to { opacity: 1; transform: scaleX(1); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <rect class="bg" width="840" height="230" rx="12" />
  <rect class="glow" width="840" height="230" rx="12" />

  <text class="title" x="420" y="64" text-anchor="middle">Hi 👋, I'm Aba Ibrahim</text>
  <text class="role" x="420" y="98" text-anchor="middle">Software Engineer &amp; Motion &amp; Graphics Designer</text>
  <text class="mono" x="420" y="126" text-anchor="middle">CODE  •  DESIGN  •  MOTION</text>

  <rect class="divider" x="220" y="145" width="400" height="1.5" fill="url(#accentGrad)" />

  <text class="tagline" x="420" y="176" text-anchor="middle">
    Building reliable software systems and crafting clean visual &amp; motion experiences.
  </text>

  <g class="pill">
    <rect x="295" y="192" width="250" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle class="dot" cx="313" cy="204" r="3.5" />
    <text class="pillText" x="428" y="208" text-anchor="middle">Purwokerto, ID • Open to Collaborate</text>
  </g>
</svg>
