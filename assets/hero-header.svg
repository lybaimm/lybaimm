<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 175" width="800" height="175" role="img" aria-label="Aba Ibrahim - Software Engineer and Motion &amp; Graphics Designer">
  <defs>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.5px;
        fill: #e6edf3;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
      }
      .role {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: 0.2px;
        fill: #8b949e;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
      }
      .rule {
        fill: #30363d;
        transform-origin: 400px 104px;
        transform: scaleX(0);
        opacity: 0;
        animation: expand 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #8b949e;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
      }
      @media (prefers-color-scheme: light) {
        .name { fill: #1f2328; }
        .role, .tagline { fill: #656d76; }
        .rule { fill: #d0d7de; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes expand {
        from { opacity: 0; transform: scaleX(0); }
        to { opacity: 1; transform: scaleX(1); }
      }
    </style>
  </defs>

  <text class="name" x="400" y="54" text-anchor="middle">Aba Ibrahim</text>
  <text class="role" x="400" y="82" text-anchor="middle">Software Engineer · Motion &amp; Graphics Designer</text>
  <rect class="rule" x="376" y="103" width="48" height="1" />
  <text class="tagline" x="400" y="134" text-anchor="middle">Building reliable software and clean visual experiences.</text>
</svg>
